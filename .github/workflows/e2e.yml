name: E2E

on:
  push:
    branches: [main, reboot]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  sveltekit:
    name: SvelteKit example
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: examples/sveltekit

    env:
      # A local backend without a Convex account, so the job needs no secrets.
      CONVEX_AGENT_MODE: anonymous

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      # Also builds @convex-dev/auth, in its `prepare` script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `convex dev` provisions the local deployment, but its first push fails
      # until the env vars that convex.config.ts requires are set. Any value
      # works for them: the tests stop at GitHub's page.
      - name: Set up the local Convex deployment
        run: |
          pnpm exec convex dev --once --typecheck disable || true
          pnpm exec convex env set AUTH_GITHUB_CLIENT_ID test
          pnpm exec convex env set AUTH_GITHUB_CLIENT_SECRET test

      # Playwright starts the backend and a production build of the app.
      - name: Run the e2e tests
        run: pnpm test:e2e

      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sveltekit-e2e-traces
          path: examples/sveltekit/test-results/
          retention-days: 7

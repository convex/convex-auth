name: Publish Any Commit
# from https://github.com/stackblitz-labs/pkg.pr.new?tab=readme-ov-file

on: [push]

permissions: {}

jobs:
  build:
    if: github.repository == 'convex/convex-auth'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        # pkg.pr.new publishes preview packages, not to an npm registry.
        # zizmor: ignore[use-trusted-publishing]
        run: pnpm dlx pkg-pr-new publish --no-template ./packages/core

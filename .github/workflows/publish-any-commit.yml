name: Publish Any Commit
# from https://github.com/stackblitz-labs/pkg.pr.new?tab=readme-ov-file

on: [push]

permissions: {}

jobs:
  build:
    if: github.repository == 'convex/convex-auth'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        # pkg.pr.new publishes preview packages, not to an npm registry.
        # zizmor: ignore[use-trusted-publishing]
        run: pnpm dlx pkg-pr-new publish --no-template ./packages/core

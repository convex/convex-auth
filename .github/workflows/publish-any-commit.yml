name: Publish Any Commit
# from https://github.com/stackblitz-labs/pkg.pr.new?tab=readme-ov-file

on: [push]

permissions: {}

jobs:
  build:
    if: github.repository == 'convex/convex-auth'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        # pkg.pr.new publishes preview packages, not to an npm registry.
        # zizmor: ignore[use-trusted-publishing]
        run: pnpm dlx pkg-pr-new publish --no-template ./packages/core

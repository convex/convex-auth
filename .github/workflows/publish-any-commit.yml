name: Publish Any Commit
# from https://github.com/stackblitz-labs/pkg.pr.new?tab=readme-ov-file

on: [push]

permissions: {}

jobs:
  build:
    if: github.repository == 'convex/convex-auth'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        # pkg.pr.new publishes preview packages, not to an npm registry.
        # zizmor: ignore[use-trusted-publishing]
        run: pnpm dlx pkg-pr-new publish --no-template ./packages/core

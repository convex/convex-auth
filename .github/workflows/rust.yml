name: Rust

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "packages/password-hash-wasm/rust/**"
      - ".github/workflows/rust.yml"
      - ".github/actions/rust-setup/**"
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/password-hash-wasm/rust

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup

      - name: cargo fmt
        run: just fmt

      - name: cargo clippy
        run: just lint

      - name: cargo test
        run: just test

      - name: Compile for wasm32 target
        run: just check

  comment:
    name: Comment on PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const marker = '<!-- rust-code-modified -->';
            const body = [
              marker,
              '⚠️ **This PR modifies the Rust code.**',
              '',
              'For these changes to take effect in the TypeScript code, you will need to:',
              '',
              '1. Publish a new version of the `password-hash-wasm` package on npm.',
              '2. Update the dependency on `password-hash-wasm` in the `core` component.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

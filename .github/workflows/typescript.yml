name: TypeScript

on:
  push:
    branches: [main, reboot]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup

      - name: Rust codegen (required for password-hash-wasm typechecking)
        working-directory: packages/password-hash-wasm/rust
        run: just build

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check the published declarations
        run: pnpm check:declarations

      # `tsc` does not read the code examples in the doc comments.
      - name: Typecheck the doc comment examples
        run: pnpm check:doc-examples

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `tsc` does not compile the MDX content, thus a docs build is necessary
      # to find syntax errors in the documentation.
      - name: Build docs
        run: pnpm --filter docs build

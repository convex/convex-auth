name: TypeScript

on:
  push:
    branches: [main, reboot]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-setup

      - name: Rust codegen (required for argon2id-wasm typechecking)
        working-directory: packages/argon2id-wasm/rust
        run: just build

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check the published declarations
        run: pnpm check:declarations

      # `tsc` does not read the code examples in the doc comments.
      - name: Typecheck the doc comment examples
        run: pnpm check:doc-examples

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `tsc` does not compile the MDX content, thus a docs build is necessary
      # to find syntax errors in the documentation.
      - name: Build docs
        run: pnpm --filter docs build

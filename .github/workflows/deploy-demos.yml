name: Deploy demos
# Deploys the live demos of packages/demos/src/demos.ts to
# https://<name>.demos.convex-auth.com. See packages/demos/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Deploy only these demos (comma-separated names). Empty: all of them."
        required: false
        type: string

# Two runs must not deploy the same demo at the same time. A new push makes
# the run that waits obsolete, but a run that started must finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # Only `main` deploys. A manual run from another branch would run the code
    # of that branch with the secrets of the demos.
    if: github.repository == 'convex/convex-auth' && github.ref == 'refs/heads/main'
    # The secret and the variable of the demos are in this environment, not in
    # the repository. GitHub gives them only to jobs that name it, and the
    # environment accepts only `main`. Thus a workflow on another branch cannot
    # read the token.
    environment: demos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          # No cache: this job has the secrets of the demos, and a cache that
          # another workflow wrote could change what it runs.
          package-manager-cache: false

      # Also builds packages/core, which the examples import from `dist/`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy the demos
        env:
          CONVEX_DEMOS_ACCESS_TOKEN: ${{ secrets.CONVEX_DEMOS_ACCESS_TOKEN }}
          CONVEX_DEMOS_TEAM_ID: ${{ vars.CONVEX_DEMOS_TEAM_ID }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [[ -n "$ONLY" ]]; then args=(--only "$ONLY"); fi
          pnpm --filter demos run deploy "${args[@]}"

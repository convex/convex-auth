name: Rust setup
description: Install just, the pinned Rust toolchain, and cache cargo artifacts

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

    # Reads rust-toolchain.toml and installs the pinned toolchain + targets.
    - name: Install pinned Rust toolchain
      shell: bash
      working-directory: packages/password-hash-wasm/rust
      run: rustup toolchain install

    - name: Cache cargo registry and build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/password-hash-wasm/rust/target
        key: ${{ runner.os }}-cargo-password-hash-wasm-${{ hashFiles('packages/password-hash-wasm/rust/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-password-hash-wasm-

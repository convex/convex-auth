packages:
  - "packages/*"
  - "examples/*"
  - "scripts/*"

# Prevents by default all dependency versions released within the last 7 days
# (10080 minutes) from being installed. If necessary (e.g. to install an urgent
# security fix), override this with:
# `pnpm add <package>@<version> --config.minimumReleaseAge=0`.
minimumReleaseAge: 10080

# Packages listed here skip the wait above. Avoid adding third party packages
# to this list.
minimumReleaseAgeExclude:
  - password-hash-wasm
  - convex
  - convex-test

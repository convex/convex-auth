packages:
  - "packages/*"
  - "examples/*"
  - "scripts/*"

# Prevents by default all dependency versions released within the last 7 days
# (10080 minutes) from being installed. If necessary (e.g. to install an urgent
# security fix), override this with:
# `pnpm add <package>@<version> --config.minimumReleaseAge=0`.
minimumReleaseAge: 10080

# Packages listed here skip the wait above. Avoid adding third party packages
# to this list.
minimumReleaseAgeExclude:
  - password-hash-wasm
  - convex
  - convex-test
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11

# `react-native-passkeys` is a dev dependency of `packages/core` for its types
# only. Its peers `expo` and `react-native` are needed at runtime in an app,
# not by `tsc`, so mark them optional to keep pnpm from installing them.
packageExtensions:
  react-native-passkeys:
    peerDependenciesMeta:
      expo:
        optional: true
      react-native:
        optional: true

packages:
  - "packages/*"
  - "examples/*"
  - "scripts/*"

# Prevents by default all dependency versions released within the last 7 days
# (10080 minutes) from being installed. If necessary (e.g. to install an urgent
# security fix), override this with:
# `pnpm add <package>@<version> --config.minimumReleaseAge=0`.
minimumReleaseAge: 10080

# Packages listed here skip the wait above. Avoid adding third party packages
# to this list.
minimumReleaseAgeExclude:
  - password-hash-wasm
  - convex
  - convex-test
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: next@16.4.1
  - next@16.4.1
  # Renovate security update: vite@8.1.6
  - vite@8.1.6

# Dependencies whose install scripts we don't need. pnpm fails the install on
# any build script that isn't listed here, so new ones must be reviewed.
allowBuilds:
  "@swc/core": false
  core-js: false
  esbuild: false
  sharp: false
